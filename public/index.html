<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>FlightGear Live Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; }
  #hud {
    position: absolute; top: 10px; left: 50px; z-index: 1000;
    background: rgba(20,20,20,0.75); color: #e8e8e8;
    font: 13px/1.5 -apple-system, sans-serif;
    padding: 8px 12px; border-radius: 6px;
    pointer-events: none; max-width: 320px;
  }
  #hud .stale { color: #ff6b6b; }
  #hudFreqBlock { margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.15); color: #ccc; font-size: 12px; }
  #hudFreqBlock .freq-airport { color: #8ecbff; font-weight: bold; }
  #hudAtcBlock { margin-top: 4px; font-size: 12px; }
  #hudAtcBlock .atc-live { color: #6bdc8a; font-weight: bold; }
  #hudAtcBlock .atc-none { color: #ffb84d; }
  #connDot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 6px; background: #888;
  }
  #connDot.ok { background: #3ddc65; }
  #connDot.bad { background: #ff6b6b; }
  #toolbar {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    display: flex; gap: 8px;
  }
  .menu { position: relative; }
  .menu > .menu-trigger {
    background: #2b2b2b; color: #e8e8e8; border: 1px solid #555;
    font: 13px -apple-system, sans-serif;
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .menu > .menu-trigger::after { content: '▾'; font-size: 10px; opacity: 0.7; }
  .menu.open > .menu-trigger { background: #3a3a3a; border-color: #777; }
  .menu-panel {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 1001;
    background: #2b2b2b; border: 1px solid #555; border-radius: 8px;
    padding: 6px; display: none; flex-direction: column; gap: 3px;
    min-width: 190px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .menu.open > .menu-panel { display: flex; }
  .menu-panel button {
    background: transparent; color: #e8e8e8; border: none;
    font: 13px -apple-system, sans-serif; text-align: left;
    padding: 8px 10px; border-radius: 5px; cursor: pointer;
  }
  .menu-panel button:hover { background: #3a3a3a; }
  .menu-panel button.active,
  .menu-panel button.toggle-on { background: #2f7dd6; color: #fff; }
  .menu-panel button.active { background: #ff4444; }
  .menu-panel button.danger { color: #ff6b6b; }
  .menu-panel button.danger:hover { background: #a33; color: #fff; }
  .menu-panel hr { border: none; border-top: 1px solid #444; margin: 3px 0; }
  #finishLineBtn {
    position: absolute; top: 10px; right: 190px; z-index: 1001;
    background: #ff4444; color: #fff; border: 1px solid #ff4444;
    font: 13px -apple-system, sans-serif;
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    display: none;
  }
  #colorPicker {
    display: flex; gap: 5px; align-items: center;
    padding: 6px 10px;
  }
  #colorPicker .swatch {
    width: 20px; height: 20px; border-radius: 4px; cursor: pointer;
    border: 2px solid transparent;
  }
  #colorPicker .swatch.selected { border-color: #fff; }
  #taxiPanel { min-width: 260px; }
  #taxiInstructionText {
    width: 100%; box-sizing: border-box; resize: vertical;
    background: #1c1c1c; color: #fff; border: 1px solid #555; border-radius: 6px;
    padding: 8px; font: 13px -apple-system, sans-serif; margin-bottom: 6px;
  }
  #taxiDrawBtn.primary-action { background: #2f7dd6 !important; border-color: #2f7dd6; color: #fff; text-align: center; }
  #taxiStatus { font-size: 12px; color: #ccc; padding: 4px 2px 0; white-space: pre-wrap; }
  #taxiStatus.error { color: #ff6b6b; }
  #taxiStatus.ok { color: #6bdc8a; }
  #navlogPanel { min-width: 300px; }
  #navlogText {
    width: 100%; box-sizing: border-box; resize: vertical;
    background: #1c1c1c; color: #fff; border: 1px solid #555; border-radius: 6px;
    padding: 8px; font: 11px/1.4 ui-monospace, monospace; margin-bottom: 6px;
  }
  #navlogCallsign {
    width: 100%; box-sizing: border-box; padding: 7px 8px; border-radius: 6px;
    border: 1px solid #555; background: #1c1c1c; color: #fff;
    font: 12px -apple-system, sans-serif; margin-bottom: 6px;
  }
  #navlogDrawBtn.primary-action { background: #2f7dd6 !important; border-color: #2f7dd6; color: #fff; text-align: center; }
  #navlogStatus { font-size: 12px; color: #ccc; padding: 4px 2px 0; white-space: pre-wrap; }
  #navlogStatus.error { color: #ff6b6b; }
  #navlogStatus.ok { color: #6bdc8a; }
  .leaflet-tooltip.waypoint-label {
    background: transparent; border: none; box-shadow: none; padding: 0;
    color: #8ecbff; font: bold 11px -apple-system, sans-serif;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
    white-space: nowrap; user-select: none; pointer-events: none;
  }
  .leaflet-tooltip.waypoint-label::before { display: none; } /* kill the little arrow */
  .taxi-label {
    color: #ffdd00; font: bold 13px -apple-system, sans-serif;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
    white-space: nowrap; cursor: move; user-select: none;
  }
  .taxi-label-taxiway {
    color: #4da6ff; font: bold 13px -apple-system, sans-serif;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
    white-space: nowrap; cursor: move; user-select: none;
  }
  #measureTooltip {
    position: absolute; z-index: 1000; display: none;
    background: rgba(20,20,20,0.85); color: #fff;
    font: 12px -apple-system, sans-serif;
    padding: 4px 8px; border-radius: 4px;
    pointer-events: none; white-space: nowrap;
    transform: translate(14px, 14px);
  }
  #hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: rgba(20,20,20,0.7); color: #ccc;
    font: 12px -apple-system, sans-serif; padding: 4px 10px; border-radius: 4px;
    pointer-events: none;
  }
  #labelEditBackdrop {
    display: none; position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,0.5);
    align-items: center; justify-content: center;
  }
  #labelEditBackdrop.open { display: flex; }
  #labelEditModal {
    background: #2b2b2b; border: 1px solid #555; border-radius: 10px;
    padding: 18px; width: 260px; color: #e8e8e8; font: 13px -apple-system, sans-serif;
  }
  #labelEditModal h3 { margin: 0 0 12px; font-size: 14px; }
  #labelEditModal input[type=text] {
    width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px;
    border: 1px solid #555; background: #1c1c1c; color: #fff; font-size: 14px;
    margin-bottom: 12px;
  }
  .colour-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .colour-choice {
    flex: 1; padding: 8px; border-radius: 6px; cursor: pointer; text-align: center;
    border: 2px solid transparent; font-weight: bold;
  }
  .colour-choice.yellow { color: #ffdd00; background: #1c1c1c; }
  .colour-choice.blue { color: #4da6ff; background: #1c1c1c; }
  .colour-choice.selected { border-color: #fff; }
  #labelEditModal .btn-row { display: flex; justify-content: space-between; gap: 8px; }
  #labelEditModal button {
    flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #555;
    background: #3a3a3a; color: #e8e8e8; cursor: pointer; font-size: 13px;
  }
  #labelEditModal button.primary { background: #2f7dd6; border-color: #2f7dd6; color: #fff; }
  #labelEditModal button.danger { background: #a33; border-color: #a33; color: #fff; }
  #arcEditBackdrop {
    display: none; position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,0.5);
    align-items: center; justify-content: center;
  }
  #arcEditBackdrop.open { display: flex; }
  #arcEditModal {
    background: #2b2b2b; border: 1px solid #555; border-radius: 10px;
    padding: 18px; width: 260px; color: #e8e8e8; font: 13px -apple-system, sans-serif;
  }
  #arcEditModal h3 { margin: 0 0 12px; font-size: 14px; }
  #arcEditModal label { display: block; font-size: 11px; color: #999; margin-bottom: 4px; }
  #arcEditModal input[type=number] {
    width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px;
    border: 1px solid #555; background: #1c1c1c; color: #fff; font-size: 14px;
    margin-bottom: 12px;
  }
  #arcEditModal .colour-choice.dir { font-size: 12px; color: #e8e8e8; background: #1c1c1c; }
  #arcEditModal label:not(:first-of-type) { margin-top: 4px; }
  #arcEditModal .btn-row { display: flex; justify-content: space-between; gap: 8px; }
  #arcEditModal button {
    flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #555;
    background: #3a3a3a; color: #e8e8e8; cursor: pointer; font-size: 13px;
  }
  #arcEditModal button.primary { background: #2f7dd6; border-color: #2f7dd6; color: #fff; }
  #arcEditModal button.danger { background: #a33; border-color: #a33; color: #fff; }
  #airportSearch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; width: 280px;
  }
  #airportSearchInput {
    width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 6px;
    border: 1px solid #555; background: rgba(20,20,20,0.85); color: #fff;
    font: 13px -apple-system, sans-serif;
  }
  #airportSearchInput::placeholder { color: #999; }
  #airportResults {
    display: none; margin-top: 4px; background: #2b2b2b; border: 1px solid #555;
    border-radius: 6px; max-height: 260px; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #airportResults.open { display: block; }
  #airportResults .result {
    padding: 8px 12px; cursor: pointer; font: 13px -apple-system, sans-serif; color: #e8e8e8;
  }
  #airportResults .result:hover, #airportResults .result.highlighted { background: #3a3a3a; }
  #airportResults .result .code { color: #4da6ff; font-weight: bold; margin-right: 6px; }
  #airportResults .result .place { color: #999; font-size: 12px; }
  #airportResults .empty { padding: 8px 12px; color: #999; font-size: 13px; }
  #airportPinSearch { padding: 4px 2px; }
  #airportPinInput {
    width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px;
    border: 1px solid #555; background: #1c1c1c; color: #fff;
    font: 13px -apple-system, sans-serif;
  }
  #airportPinInput::placeholder { color: #999; }
  #airportPinResults {
    display: none; margin-top: 4px; background: #1c1c1c; border: 1px solid #555;
    border-radius: 6px; max-height: 220px; overflow-y: auto;
  }
  #airportPinResults.open { display: block; }
  #airportPinResults .result {
    padding: 7px 10px; cursor: pointer; font: 12px -apple-system, sans-serif; color: #e8e8e8;
  }
  #airportPinResults .result:hover, #airportPinResults .result.highlighted { background: #3a3a3a; }
  #airportPinResults .result .code { color: #4da6ff; font-weight: bold; margin-right: 6px; }
  #airportPinResults .result .place { color: #999; font-size: 11px; }
  #airportPinResults .empty { padding: 7px 10px; color: #999; font-size: 12px; }
  #circuitPanel { min-width: 220px; }
  #circuitPanel label { display: block; font-size: 11px; color: #999; margin: 6px 0 4px; }
  #circuitPanel input[type=number] {
    width: 100%; box-sizing: border-box; padding: 7px; border-radius: 6px;
    border: 1px solid #555; background: #1c1c1c; color: #fff; font-size: 14px;
  }
  #circuitUseCurrentBtn {
    width: 100%; margin-top: 6px; background: #2f7dd6 !important;
    border-color: #2f7dd6; color: #fff; text-align: center;
  }
  .circuit-dir-choice {
    flex: 1; padding: 8px; border-radius: 6px; cursor: pointer; text-align: center;
    border: 2px solid transparent; font-weight: bold; font-size: 12px;
    background: #1c1c1c; color: #e8e8e8;
  }
  .circuit-dir-choice.selected { border-color: #fff; background: #2f7dd6; }
  #circuitTable { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  #circuitTable td { padding: 6px 4px; border-bottom: 1px solid #444; }
  #circuitTable td:first-child { color: #ccc; }
  #circuitTable td:last-child { color: #ffdd00; font-weight: bold; text-align: right; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud"><span id="connDot"></span><span id="hudText">Connecting to FlightGear&hellip;</span><div id="hudFreqBlock"></div><div id="hudAtcBlock"></div></div>
<div id="airportSearch">
  <input type="text" id="airportSearchInput" placeholder="Search UK aerodrome (name or ICAO)…" autocomplete="off" />
  <div id="airportResults"></div>
</div>
<button id="finishLineBtn">Finish Line</button>
<div id="toolbar">
  <div class="menu" id="viewMenu">
    <button class="menu-trigger">View</button>
    <div class="menu-panel">
      <button id="followBtn">Autofollow</button>
      <button id="headingLineBtn">Heading Line</button>
      <button id="waypointsBtn">Waypoints</button>
      <hr />
      <button id="trailClearBtn">Clear Trail</button>
    </div>
  </div>
  <div class="menu" id="markupMenu">
    <button class="menu-trigger">Markup</button>
    <div class="menu-panel">
      <button id="labelBtn">+ Add Label</button>
      <button id="lineBtn">+ Draw Line</button>
      <button id="freehandBtn">Freehand</button>
      <button id="arcBtn">+ Add 90&deg; Arc</button>
      <hr />
      <button id="undoBtn">Undo Last Stroke</button>
      <button id="clearAllBtn" class="danger">Clear All Drawings</button>
      <button id="clearAllLabelsBtn" class="danger">Clear All Labels</button>
      <hr />
      <div id="airportPinSearch">
        <input type="text" id="airportPinInput" placeholder="+ Add airport pin&hellip;" autocomplete="off" />
        <div id="airportPinResults"></div>
      </div>
      <div id="colorPicker"></div>
    </div>
  </div>
  <div class="menu" id="navlogMenu">
    <button class="menu-trigger">Route</button>
    <div class="menu-panel" id="navlogPanel">
      <textarea id="navlogText" rows="6" placeholder="Paste a SimBrief-style OFP navlog here&hellip;"></textarea>
      <input type="text" id="navlogCallsign" placeholder="Callsign (blank = use live sim callsign)" />
      <button id="navlogDrawBtn" class="primary-action">Draw Route + UNICOM Calls</button>
      <button id="navlogClearBtn" class="danger">Clear Imported Route</button>
      <div id="navlogStatus"></div>
    </div>
  </div>
  <div class="menu" id="taxiMenu">
    <button class="menu-trigger">Taxi Route</button>
    <div class="menu-panel" id="taxiPanel">
      <textarea id="taxiInstructionText" rows="3" placeholder="e.g. Taxi to holding point Juliet 1 via Delta, Bravo"></textarea>
      <button id="taxiDrawBtn" class="primary-action">Draw Route</button>
      <div id="taxiStatus"></div>
    </div>
  </div>
  <div class="menu" id="circuitMenu">
    <button class="menu-trigger">Circuit</button>
    <div class="menu-panel" id="circuitPanel">
      <label>Runway heading (&deg;)</label>
      <input type="number" id="circuitRwyHeading" min="0" max="359" value="60" />
      <button id="circuitUseCurrentBtn">Use current heading</button>
      <label>Circuit direction</label>
      <div class="colour-row">
        <div class="circuit-dir-choice selected" data-circuitdir="right">Right-hand</div>
        <div class="circuit-dir-choice" data-circuitdir="left">Left-hand</div>
      </div>
      <table id="circuitTable">
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<div id="measureTooltip"></div>
<div id="hint">Double-click empty map to measure heading/distance &middot; double-click again to clear</div>

<div id="labelEditBackdrop">
  <div id="labelEditModal">
    <h3>Edit label</h3>
    <input type="text" id="labelEditText" />
    <div class="colour-row">
      <div class="colour-choice yellow" data-colour="yellow">Yellow</div>
      <div class="colour-choice blue" data-colour="blue">Blue</div>
    </div>
    <div class="btn-row">
      <button id="labelEditDelete" class="danger">Delete</button>
      <button id="labelEditCancel">Cancel</button>
      <button id="labelEditSave" class="primary">Save</button>
    </div>
  </div>
</div>

<div id="arcEditBackdrop">
  <div id="arcEditModal">
    <h3>Edit 90&deg; arc</h3>
    <label>Radius (m)</label>
    <input type="number" id="arcEditRadius" min="10" step="10" />
    <label>Rotation &mdash; start heading (&deg;)</label>
    <input type="number" id="arcEditRotation" min="0" max="359" step="1" />
    <label>Turn direction</label>
    <div class="colour-row">
      <div class="colour-choice dir" data-dir="cw">Right (CW)</div>
      <div class="colour-choice dir" data-dir="ccw">Left (CCW)</div>
    </div>
    <label>Colour</label>
    <div class="colour-row">
      <div class="colour-choice yellow" data-colour="#ffdd00" style="color:#ffdd00;">Yellow</div>
      <div class="colour-choice blue" data-colour="#4da6ff" style="color:#4da6ff;">Blue</div>
      <div class="colour-choice" data-colour="#33cc33" style="color:#33cc33;">Green</div>
      <div class="colour-choice" data-colour="#ff4444" style="color:#ff4444;">Red</div>
    </div>
    <div class="btn-row">
      <button id="arcEditDelete" class="danger">Delete</button>
      <button id="arcEditCancel">Cancel</button>
      <button id="arcEditSave" class="primary">Save</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// --- Dropdown menus: click trigger to open, click elsewhere to close ---
const menus = [...document.querySelectorAll('.menu')];
menus.forEach((menu) => {
  menu.querySelector('.menu-trigger').addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = menu.classList.contains('open');
    menus.forEach((m) => m.classList.remove('open'));
    if (!wasOpen) menu.classList.add('open');
  });
});
document.addEventListener('click', (e) => {
  if (e.target.closest('.menu-panel')) return; // clicks inside a panel (textarea, swatches) shouldn't close it
  menus.forEach((m) => m.classList.remove('open'));
});
// Selecting a tool closes its menu so it doesn't sit over the map while you work.
// (Taxi Route's Draw button is excluded — it needs the panel to stay open to show the result.)
document.querySelectorAll('.menu-panel button:not(#taxiDrawBtn):not(#navlogDrawBtn):not(#navlogClearBtn)').forEach((btn) => {
  btn.addEventListener('click', () => {
    const menu = btn.closest('.menu');
    if (menu) menu.classList.remove('open');
  });
});

const map = L.map('map', { doubleClickZoom: false }).setView([53.3537, -2.2750], 12); // default: EGCC
// Reverted from CARTO's Voyager tiles back to plain OSM: CARTO's free
// anonymous tile CDN started demanding an API key (either a rate-limit
// change or a policy change on their end), so it's no longer reliable
// without a paid key. Trade-off: back to local-script place names in
// non-English regions, but the map actually loads everywhere again.
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19,
}).addTo(map);

// --- UK aerodrome search: type a name/ICAO/IATA, fly to it -------------
const airportSearchInput = document.getElementById('airportSearchInput');
const airportResults = document.getElementById('airportResults');
let searchDebounce = null;
let searchResults = [];
let searchHighlight = -1;

function renderSearchResults() {
  if (searchResults.length === 0) {
    airportResults.innerHTML = '<div class="empty">No matches</div>';
    airportResults.classList.add('open');
    return;
  }
  airportResults.innerHTML = searchResults
    .map((a, i) => {
      const code = a.icao || a.ident;
      const place = [a.municipality, a.name].filter(Boolean).join(' — ');
      return `<div class="result${i === searchHighlight ? ' highlighted' : ''}" data-i="${i}">
        <span class="code">${code}</span><span class="place">${place}</span>
      </div>`;
    })
    .join('');
  airportResults.classList.add('open');
}

function goToAirport(a) {
  map.setView([a.lat, a.lon], 14, { animate: true });
  autofollow = false;
  followBtn.classList.remove('toggle-on');
  airportResults.classList.remove('open');
  airportSearchInput.value = `${a.icao || a.ident} — ${a.name}`;
}

airportSearchInput.addEventListener('input', () => {
  const q = airportSearchInput.value.trim();
  clearTimeout(searchDebounce);
  if (q.length < 2) {
    airportResults.classList.remove('open');
    searchResults = [];
    return;
  }
  searchDebounce = setTimeout(async () => {
    const res = await fetch(`/api/airports?q=${encodeURIComponent(q)}`);
    searchResults = await res.json();
    searchHighlight = -1;
    renderSearchResults();
  }, 250);
});

airportResults.addEventListener('click', (e) => {
  const el = e.target.closest('.result');
  if (!el) return;
  goToAirport(searchResults[parseInt(el.dataset.i, 10)]);
});

airportSearchInput.addEventListener('keydown', (e) => {
  if (!airportResults.classList.contains('open') || searchResults.length === 0) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    searchHighlight = Math.min(searchHighlight + 1, searchResults.length - 1);
    renderSearchResults();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    searchHighlight = Math.max(searchHighlight - 1, 0);
    renderSearchResults();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (searchHighlight >= 0) goToAirport(searchResults[searchHighlight]);
    else if (searchResults.length === 1) goToAirport(searchResults[0]);
  } else if (e.key === 'Escape') {
    airportResults.classList.remove('open');
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#airportSearch')) airportResults.classList.remove('open');
});

// --- Add Airport Pin: type a name, pick from the dropdown, drop a pin --
// Reuses the same /api/airports search as the top nav box, but creates a
// persistent draggable/editable label (like any other marking) instead of
// just flying the map there.
const airportPinInput = document.getElementById('airportPinInput');
const airportPinResults = document.getElementById('airportPinResults');
let pinSearchDebounce = null;
let pinSearchResults = [];

function renderPinResults() {
  if (pinSearchResults.length === 0) {
    airportPinResults.innerHTML = '<div class="empty">No matches</div>';
    airportPinResults.classList.add('open');
    return;
  }
  airportPinResults.innerHTML = pinSearchResults
    .map((a, i) => {
      const code = a.icao || a.ident;
      const place = [a.municipality, a.name].filter(Boolean).join(' — ');
      return `<div class="result" data-i="${i}"><span class="code">${code}</span><span class="place">${place}</span></div>`;
    })
    .join('');
  airportPinResults.classList.add('open');
}

airportPinInput.addEventListener('input', () => {
  const q = airportPinInput.value.trim();
  clearTimeout(pinSearchDebounce);
  if (q.length < 2) {
    airportPinResults.classList.remove('open');
    pinSearchResults = [];
    return;
  }
  pinSearchDebounce = setTimeout(async () => {
    const res = await fetch(`/api/airports?q=${encodeURIComponent(q)}`);
    pinSearchResults = await res.json();
    renderPinResults();
  }, 250);
});

airportPinResults.addEventListener('click', (e) => {
  const el = e.target.closest('.result');
  if (!el) return;
  const a = pinSearchResults[parseInt(el.dataset.i, 10)];
  if (!a) return;

  const label = { id: Date.now() + '-' + Math.random(), lat: a.lat, lon: a.lon, text: a.icao || a.ident, color: 'blue' };
  markings.labels.push(label);
  saveMarkings();
  renderLabel(label);
  openLabelEditor(label, labelMarkers.get(label.id));

  airportPinInput.value = '';
  airportPinResults.classList.remove('open');
  pinSearchResults = [];
  document.getElementById('markupMenu').classList.remove('open');
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#airportPinSearch')) airportPinResults.classList.remove('open');
});

// Arrow points due north (0deg) by default, so rotating it by the exact
// heading value lines it up correctly — unlike the plane emoji, which
// most fonts draw pointing up-and-to-the-right, not north.
const PLANE_SVG =
  '<svg width="28" height="28" viewBox="0 0 24 24" style="transform-origin:50% 50%;">' +
  '<path d="M12 2 L18 20 L12 16 L6 20 Z" fill="#ff4444" stroke="#fff" stroke-width="1"/>' +
  '</svg>';

const planeIcon = L.divIcon({
  className: 'plane-icon',
  html: `<div style="width:28px; height:28px;">${PLANE_SVG}</div>`,
  iconSize: [28, 28],
  iconAnchor: [14, 14],
});

let marker = null;
let hasCentered = false;
let lastKnownPosition = null; // used to scope taxi-route parsing to the current airport
const hudText = document.getElementById('hudText');
const connDot = document.getElementById('connDot');

// --- Flight trail -------------------------------------------------------
const trailClearBtn = document.getElementById('trailClearBtn');
let trailPoints = [];
let trailLine = null;
const TRAIL_MAX_POINTS = 10000;

function clearTrail() {

  if (trailLine) {
    map.removeLayer(trailLine);
    trailLine = null;
  }
}
trailClearBtn.addEventListener('click', clearTrail);

// Clears the server-side flight-history log (used for turn/maneuver

const flightLogClearBtn = document.getElementById('flightLogClearBtn');
flightLogClearBtn.addEventListener('click', async () => {

  }

// --- Heading line: extends from the plane out along current heading ----
const headingLineBtn = document.getElementById('headingLineBtn');
let headingLineOn = false;
let headingLine = null;
const HEADING_LINE_NM = 5;

function destinationPoint(lat, lon, bearingDeg, distanceNm) {
  const R = 3440.065;
  const brng = toRad(bearingDeg);
  const d = distanceNm / R;
  const lat1 = toRad(lat);
  const lon1 = toRad(lon);
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
  const lon2 =
    lon1 +
    Math.atan2(
      Math.sin(brng) * Math.sin(d) * Math.cos(lat1),
      Math.cos(d) - Math.sin(lat1) * Math.sin(lat2)
    );
  return [toDeg(lat2), toDeg(lon2)];
}

headingLineBtn.addEventListener('click', () => {
  headingLineOn = !headingLineOn;
  headingLineBtn.classList.toggle('toggle-on', headingLineOn);
  if (!headingLineOn && headingLine) {
    map.removeLayer(headingLine);
    headingLine = null;
  }
});

// Appends a trail point only if it's newer than what we already have, so
// live polling and the background-tab backfill (below) can never double
// up or go backwards.
let lastTrailTs = 0;
function addTrailPoint(lat, lon, ts) {
  if (ts <= lastTrailTs) return;
  lastTrailTs = ts;
  trailPoints.push([lat, lon]);
  if (trailPoints.length > TRAIL_MAX_POINTS) trailPoints.shift();
  if (!trailLine) {
    trailLine = L.polyline(trailPoints, { color: '#ff8844', weight: 2, opacity: 0.8 }).addTo(map);
  } else {
    trailLine.setLatLngs(trailPoints);
  }
}

// --- Departure/nearest airport frequencies, refreshed occasionally -----
const hudFreqBlock = document.getElementById('hudFreqBlock');
let lastFreqFetch = 0;
let lastFreqAirportIdent = null;
const FREQ_REFRESH_MS = 20000;

async function refreshAirportFrequencies(lat, lon) {
  const now = Date.now();
  if (now - lastFreqFetch < FREQ_REFRESH_MS) return;
  lastFreqFetch = now;
  try {
    const res = await fetch(`/api/nearest-airport-frequencies?lat=${lat}&lon=${lon}`);
    const data = await res.json();
    if (!data.airport) {
      hudFreqBlock.innerHTML = '';
      lastFreqAirportIdent = null;
      return;
    }
    lastFreqAirportIdent = data.airport.ident;
    const freqList = data.frequencies
      .map((f) => `${f.type || f.description || '?'} ${f.mhz.toFixed(3)}`)
      .join(' &middot; ');
    hudFreqBlock.innerHTML =
      `<span class="freq-airport">${data.airport.icao || data.airport.ident}</span>` +
      (freqList ? ` &nbsp; ${freqList}` : ' &nbsp; (no published frequencies)');
  } catch {
    // leave whatever was last shown
  }
}

async function poll() {
  try {
    const res = await fetch('/api/position');
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const { lat, lon, altFt, heading, groundspeedKt, callsign, ts } = data;
    connDot.className = 'ok';
    lastKnownPosition = { lat, lon, heading };

    if (!marker) {
      marker = L.marker([lat, lon], { icon: planeIcon }).addTo(map);
    } else {
      marker.setLatLng([lat, lon]);
    }
    const el = marker.getElement();
    if (el) {
      const svg = el.querySelector('svg');
      if (svg) svg.style.transform = `rotate(${heading}deg)`;
    }

    addTrailPoint(lat, lon, ts);

    if (headingLineOn) {
      const tip = destinationPoint(lat, lon, heading, HEADING_LINE_NM);
      if (!headingLine) {
        headingLine = L.polyline([[lat, lon], tip], { color: '#ff4444', weight: 2, dashArray: '2 6' }).addTo(map);
      } else {
        headingLine.setLatLngs([[lat, lon], tip]);
      }
    }

    if (!hasCentered) {
      map.setView([lat, lon], 13);
      hasCentered = true;
    } else if (autofollow) {
      map.panTo([lat, lon], { animate: true, duration: 0.8 });
    }

    hudText.innerHTML =
      `${callsign ? `<b>${callsign}</b><br/>` : ''}` +
      `Lat: ${lat.toFixed(5)} &nbsp; Lon: ${lon.toFixed(5)}<br/>` +
      `Alt: ${Math.round(altFt)} ft &nbsp; Hdg: ${Math.round(heading)}&deg; &nbsp; GS: ${Math.round(groundspeedKt)} kt<br/>`;
  } catch (err) {
    connDot.className = 'bad';
    hudText.innerHTML = `<span class="stale">No data from FlightGear (${err.message})</span>`;
  }
}
poll();
setInterval(poll, 1000);

// --- Taxiway / custom label + line editor -----------------------------
// Labels and lines both live in one markings object, persisted to disk
// on the server (markings.json) via GET/POST /api/markings, so they
// survive clearing browser data or switching browsers/machines.
const markings = { labels: [], lines: [], arcs: [] };

async function loadMarkings() {
  const res = await fetch('/api/markings');
  const data = await res.json();
  markings.labels = data.labels || [];
  markings.lines = data.lines || [];
  markings.arcs = data.arcs || [];
}

async function saveMarkings() {
  await fetch('/api/markings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(markings),
  });
}

const labelBtn = document.getElementById('labelBtn');
let addMode = false;
let labelMarkers = new Map(); // id -> L.Marker

function makeLabelIcon(text, colorOverride) {
  // Manual override wins if set. Otherwise: bare taxiway designators
  // (A, VA, NB, ...) default to blue; anything ending in a digit is a
  // numbered holding point, which defaults to yellow.
  const cls =
    colorOverride === 'blue'
      ? 'taxi-label-taxiway'
      : colorOverride === 'yellow'
      ? 'taxi-label'
      : /\d$/.test(text)
      ? 'taxi-label'
      : 'taxi-label-taxiway';
  return L.divIcon({
    className: 'taxi-label-wrap',
    html: `<div class="${cls}">${text}</div>`,
    iconSize: null,
    iconAnchor: [4, 8],
  });
}

function renderLabel(label) {
  const marker = L.marker([label.lat, label.lon], {
    icon: makeLabelIcon(label.text, label.color),
    draggable: true,
  }).addTo(map);

  marker.on('dragend', () => {
    const { lat, lng } = marker.getLatLng();
    label.lat = lat;
    label.lon = lng;
    saveMarkings();
  });

  // Click opens the edit modal (text + colour + delete all in one place).
  // Shift+click stays as a fast one-step delete shortcut.
  marker.on('click', (e) => {
    if (e.originalEvent.shiftKey) {
      markings.labels = markings.labels.filter((l) => l.id !== label.id);
      saveMarkings();
      map.removeLayer(marker);
      labelMarkers.delete(label.id);
      return;
    }
    openLabelEditor(label, marker);
  });

  labelMarkers.set(label.id, marker);
}

// --- Label edit modal: text + colour + delete, all in one place --------
const labelEditBackdrop = document.getElementById('labelEditBackdrop');
const labelEditText = document.getElementById('labelEditText');
const labelEditDelete = document.getElementById('labelEditDelete');
const labelEditCancel = document.getElementById('labelEditCancel');
const labelEditSave = document.getElementById('labelEditSave');
const colourChoices = [...document.querySelectorAll('#labelEditModal .colour-choice')];
let editingLabel = null;
let editingMarker = null;
let editingColour = null;

function openLabelEditor(label, marker) {
  editingLabel = label;
  editingMarker = marker;
  editingColour = label.color || (/\d$/.test(label.text) ? 'yellow' : 'blue');
  labelEditText.value = label.text;
  colourChoices.forEach((el) => el.classList.toggle('selected', el.dataset.colour === editingColour));
  labelEditBackdrop.classList.add('open');
  labelEditText.focus();
  labelEditText.select();
}

function closeLabelEditor() {
  labelEditBackdrop.classList.remove('open');
  editingLabel = null;
  editingMarker = null;
}

colourChoices.forEach((el) => {
  el.addEventListener('click', () => {
    editingColour = el.dataset.colour;
    colourChoices.forEach((c) => c.classList.toggle('selected', c === el));
  });
});

labelEditSave.addEventListener('click', () => {
  if (!editingLabel) return;
  const text = labelEditText.value.trim();
  if (!text) return;
  editingLabel.text = text;
  editingLabel.color = editingColour;
  editingMarker.setIcon(makeLabelIcon(text, editingColour));
  saveMarkings();
  closeLabelEditor();
});

labelEditDelete.addEventListener('click', () => {
  if (!editingLabel) return;
  markings.labels = markings.labels.filter((l) => l.id !== editingLabel.id);
  saveMarkings();
  map.removeLayer(editingMarker);
  labelMarkers.delete(editingLabel.id);
  closeLabelEditor();
});

labelEditCancel.addEventListener('click', closeLabelEditor);
labelEditBackdrop.addEventListener('click', (e) => {
  if (e.target === labelEditBackdrop) closeLabelEditor();
});
labelEditText.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') labelEditSave.click();

labelBtn.addEventListener('click', () => {
  addMode = !addMode;
  labelBtn.classList.toggle('active', addMode);
  labelBtn.textContent = addMode ? 'Click map to place…' : '+ Add Label';
});

map.on('click', (e) => {
  if (!addMode) return;
  const text = prompt('Taxiway/label text (e.g. "A", "Y2", "Rwy 23R"):');
  addMode = false;
  labelBtn.classList.remove('active');

  const label = { id: Date.now() + '-' + Math.random(), lat: e.latlng.lat, lon: e.latlng.lng, text };

// --- Colour picker: applies to new "Draw Line" and Freehand strokes ----
const COLORS = [

  { name: 'cyan', hex: '#00ccff' },
  { name: 'red', hex: '#ff4444' },
  { name: 'green', hex: '#44ff77' },

// Tracks lines added via Draw Line / Freehand this session, for Undo.
// (Pre-existing markings loaded from disk are never auto-undoable.)
let strokeStack = [];

// --- Line drawing (taxiway centerlines, routes, etc.) ------------------
const lineBtn = document.getElementById('lineBtn');
const finishLineBtn = document.getElementById('finishLineBtn');
let drawMode = false;
let drawPoints = [];
let drawPreview = null;
let lineLayers = new Map(); // id -> L.Polyline

function renderLine(line) {
  const poly = L.polyline(line.points, {
    color: line.color || '#ffdd00',
    weight: line.taxiRoute ? 4 : 3,
    dashArray: line.freehand || line.taxiRoute ? null : '6 6',
  }).addTo(map);

  if (line.text) {
    poly.bindTooltip(line.text, { permanent: true, direction: 'center', className: 'taxi-label' });
  }

  // Click to rename, shift+click to delete.
  poly.on('click', (e) => {
    L.DomEvent.stopPropagation(e);
    if (e.originalEvent.shiftKey) {
      markings.lines = markings.lines.filter((l) => l.id !== line.id);
      saveMarkings();
      map.removeLayer(poly);
      lineLayers.delete(line.id);
      return;
    }
    const next = prompt('Line label (optional):', line.text || '');
    if (next === null) return;
    line.text = next;
    poly.unbindTooltip();
    if (next) poly.bindTooltip(next, { permanent: true, direction: 'center', className: 'taxi-label' });
    saveMarkings();
  });

  lineLayers.set(line.id, poly);
}

function cancelDraw() {
  drawMode = false;
  drawPoints = [];
  lineBtn.classList.remove('active');
  lineBtn.textContent = '+ Draw Line';
  finishLineBtn.style.display = 'none';
  if (drawPreview) {
    map.removeLayer(drawPreview);
    drawPreview = null;
  }
  measureTooltip.style.display = 'none';
}

function finishLine() {
  if (drawPoints.length < 2) {
    cancelDraw();
    return;
  }
  const text = prompt('Line label (optional, e.g. "Holding Point A1"):') || '';
  const line = { id: Date.now() + '-' + Math.random(), points: drawPoints, text, color: currentColor };
  markings.lines.push(line);
  strokeStack.push({ type: 'line', id: line.id });
  saveMarkings();
  renderLine(line);
  cancelDraw();
}

lineBtn.addEventListener('click', () => {
  if (drawMode) {
    cancelDraw();
    return;
  }
  drawMode = true;
  drawPoints = [];
  lineBtn.classList.add('active');
  lineBtn.textContent = 'Click to add points (Esc to cancel)';
  finishLineBtn.style.display = 'inline-block';
});

finishLineBtn.addEventListener('click', finishLine);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && drawMode) cancelDraw();
});

map.on('click', (e) => {
  if (!drawMode) return;
  drawPoints.push([e.latlng.lat, e.latlng.lng]);
  if (drawPreview) map.removeLayer(drawPreview);
  drawPreview = L.polyline(drawPoints, { color: currentColor, weight: 3, dashArray: '6 6' }).addTo(map);
});

// Live heading/distance readout for the segment currently being drawn —
// e.g. click a runway threshold, then watch the heading as you aim for
// the extended centerline, instead of eyeballing it.
map.on('mousemove', (e) => {
  if (!drawMode || drawPoints.length === 0) {
    return;
  }
  const last = drawPoints[drawPoints.length - 1];
  const lastLatLng = { lat: last[0], lng: last[1] };
  const brg = initialBearingDeg(lastLatLng, e.latlng);
  const dist = greatCircleDistanceNm(lastLatLng, e.latlng);

  const point = map.latLngToContainerPoint(e.latlng);
  const mapRect = map.getContainer().getBoundingClientRect();
  measureTooltip.style.left = `${mapRect.left + point.x}px`;
  measureTooltip.style.top = `${mapRect.top + point.y}px`;
  measureTooltip.textContent = `${Math.round(brg).toString().padStart(3, '0')}°  ·  ${dist.toFixed(2)} NM`;
  measureTooltip.style.display = 'block';
});

map.on('dblclick', (e) => {
  if (addMode || freehandMode || drawMode) return; // those tools own this click

  toggleMeasure(e.latlng);
});

// --- Freehand draw: click-drag to sketch a route/hazard mark-up --------
const freehandBtn = document.getElementById('freehandBtn');
let freehandMode = false;
let freehandDrawing = false;
let freehandPoints = [];
let freehandPreview = null;

freehandBtn.addEventListener('click', () => {
  freehandMode = !freehandMode;
  freehandBtn.classList.toggle('active', freehandMode);
  map.dragging[freehandMode ? 'disable' : 'enable']();
  if (!freehandMode && freehandPreview) {
    map.removeLayer(freehandPreview);
    freehandPreview = null;
    freehandDrawing = false;
    freehandPoints = [];
  }
});

map.on('mousedown', (e) => {
  if (!freehandMode) return;
  freehandDrawing = true;
  freehandPoints = [[e.latlng.lat, e.latlng.lng]];
  freehandPreview = L.polyline(freehandPoints, { color: currentColor, weight: 3 }).addTo(map);
});

map.on('mousemove', (e) => {
  if (!freehandMode || !freehandDrawing) return;
  freehandPoints.push([e.latlng.lat, e.latlng.lng]);
  freehandPreview.setLatLngs(freehandPoints);
});

map.on('mouseup', () => {
  if (!freehandMode || !freehandDrawing) return;
  freehandDrawing = false;
  if (freehandPreview) {
    map.removeLayer(freehandPreview);
    freehandPreview = null;
  }
  if (freehandPoints.length < 2) {
    freehandPoints = [];
    return;
  }
  const line = {
    id: Date.now() + '-' + Math.random(),
    points: freehandPoints,
    text: '',
    color: currentColor,
    freehand: true,
  };
  markings.lines.push(line);
  strokeStack.push({ type: 'line', id: line.id });
  saveMarkings();
  renderLine(line);
  freehandPoints = [];
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && freehandMode) {
    freehandDrawing = false;
    freehandPoints = [];
    if (freehandPreview) {
      map.removeLayer(freehandPreview);
      freehandPreview = null;
    }
  }
});

// --- Undo last stroke / Clear all drawings ------------------------------
const undoBtn = document.getElementById('undoBtn');
const clearAllBtn = document.getElementById('clearAllBtn');

undoBtn.addEventListener('click', () => {
  const stroke = strokeStack.pop();
  if (!stroke) return;
  if (stroke.type === 'arc') {
    removeArc(stroke.id, { save: false });
  } else {
    const layer = lineLayers.get(stroke.id);
    if (layer) map.removeLayer(layer);
    lineLayers.delete(stroke.id);
    markings.lines = markings.lines.filter((l) => l.id !== stroke.id);
  }
  saveMarkings();
});

clearAllBtn.addEventListener('click', () => {
  const total = markings.lines.length + markings.arcs.length;
  if (total === 0) return;
  if (!confirm(`Clear all ${total} drawn line(s)/arc(s)/route mark-up? This cannot be undone.`)) return;
  markings.lines.forEach((l) => {
    const layer = lineLayers.get(l.id);
    if (layer) map.removeLayer(layer);
  });
  lineLayers.clear();
  [...markings.arcs].forEach((a) => removeArc(a.id, { save: false }));
  markings.lines = [];
  strokeStack = [];
  saveMarkings();
});

const clearAllLabelsBtn = document.getElementById('clearAllLabelsBtn');
clearAllLabelsBtn.addEventListener('click', () => {
  const total = markings.labels.length;
  if (total === 0) return;
  // This wipes every taxiway/holding-point label, not just route imports —
  // that's potentially hours of calibrated work across many airports, so
  // it needs a harder confirmation than the usual destructive actions.
  if (!confirm(`Clear ALL ${total} labels across every airport? This includes taxiway/holding-point work, not just imported routes. This cannot be undone from the UI (a server-side backup is taken automatically, but you'd need to restore it by hand).`)) return;
  if (prompt(`Type DELETE to confirm removing all ${total} labels:`) !== 'DELETE') return;

  markings.labels.forEach((l) => {
    const marker = labelMarkers.get(l.id);
    if (marker) map.removeLayer(marker);
  });
  labelMarkers.clear();
  markings.labels = [];
  saveMarkings();
});

// --- 90° arc tool: for planning turn radius (e.g. base-to-final) -------
// An arc is {id, lat, lon (center), radiusM, rotationDeg (start heading),
// dir ('cw'|'ccw'), color}. Rendered as a polyline approximating the curve,
// with a small draggable handle at the center for repositioning.
const arcBtn = document.getElementById('arcBtn');
const arcLayers = new Map(); // id -> { poly, handle }
let addArcMode = false;

function computeArcPoints(lat, lon, radiusM, rotationDeg, dir) {
  const radiusNm = radiusM / 1852;
  const sign = dir === 'ccw' ? -1 : 1;
  const points = [];
  const STEPS = 36;
  for (let i = 0; i <= STEPS; i++) {
    const bearing = rotationDeg + sign * (90 * i) / STEPS;
    points.push(destinationPoint(lat, lon, bearing, radiusNm));
  }
  return points;
}

function renderArc(arc) {
  const poly = L.polyline(computeArcPoints(arc.lat, arc.lon, arc.radiusM, arc.rotationDeg, arc.dir), {
    color: arc.color || '#ffdd00',
    weight: 4,
  }).addTo(map);

  const handle = L.marker([arc.lat, arc.lon], {
    icon: L.divIcon({
      className: 'arc-handle',
      html: `<div style="width:12px;height:12px;border-radius:50%;background:${arc.color || '#ffdd00'};border:2px solid #fff;"></div>`,
      iconSize: [12, 12],
      iconAnchor: [6, 6],
    }),
    draggable: true,
  }).addTo(map);

  handle.on('drag', () => {
    const { lat, lng } = handle.getLatLng();
    poly.setLatLngs(computeArcPoints(lat, lng, arc.radiusM, arc.rotationDeg, arc.dir));
  });
  handle.on('dragend', () => {
    const { lat, lng } = handle.getLatLng();
    arc.lat = lat;
    arc.lon = lng;
    saveMarkings();
  });

  const openEditor = (e) => {
    if (e?.originalEvent) L.DomEvent.stopPropagation(e);
    openArcEditor(arc);
  };
  poly.on('click', openEditor);
  handle.on('click', openEditor);

  arcLayers.set(arc.id, { poly, handle });
}

function removeArc(id, { save = true } = {}) {
  const layers = arcLayers.get(id);
  if (layers) {
    map.removeLayer(layers.poly);
    map.removeLayer(layers.handle);
    arcLayers.delete(id);
  }
  markings.arcs = markings.arcs.filter((a) => a.id !== id);
  if (save) saveMarkings();
}

arcBtn.addEventListener('click', () => {
  addArcMode = !addArcMode;
  arcBtn.classList.toggle('active', addArcMode);
  arcBtn.textContent = addArcMode ? 'Click map to place…' : '+ Add 90° Arc';
});

map.on('click', (e) => {
  if (!addArcMode) return;
  addArcMode = false;
  arcBtn.classList.remove('active');
  arcBtn.textContent = '+ Add 90° Arc';

  const arc = {
    id: Date.now() + '-' + Math.random(),
    lat: e.latlng.lat,
    lon: e.latlng.lng,
    radiusM: 800,
    rotationDeg: 0,
    dir: 'cw',
    color: currentColor,
  };
  markings.arcs.push(arc);
  strokeStack.push({ type: 'arc', id: arc.id });
  saveMarkings();
  renderArc(arc);
  openArcEditor(arc);
});

// --- Arc edit modal ------------------------------------------------------
const arcEditBackdrop = document.getElementById('arcEditBackdrop');
const arcEditRadius = document.getElementById('arcEditRadius');
const arcEditRotation = document.getElementById('arcEditRotation');
const arcEditDelete = document.getElementById('arcEditDelete');
const arcEditCancel = document.getElementById('arcEditCancel');
const arcEditSave = document.getElementById('arcEditSave');
const arcDirChoices = [...document.querySelectorAll('.colour-choice.dir')];
const arcColourChoices = [...arcEditBackdrop.querySelectorAll('.colour-choice[data-colour]')];
let editingArc = null;
let editingArcDir = 'cw';
let editingArcColor = '#ffdd00';

function openArcEditor(arc) {
  editingArc = arc;
  editingArcDir = arc.dir;
  editingArcColor = arc.color || '#ffdd00';
  arcEditRadius.value = Math.round(arc.radiusM);
  arcEditRotation.value = Math.round(arc.rotationDeg);
  arcDirChoices.forEach((el) => el.classList.toggle('selected', el.dataset.dir === editingArcDir));
  arcColourChoices.forEach((el) => el.classList.toggle('selected', el.dataset.colour === editingArcColor));
  arcEditBackdrop.classList.add('open');
}

function closeArcEditor() {
  arcEditBackdrop.classList.remove('open');
  editingArc = null;
}

function liveUpdateArcPreview() {
  if (!editingArc) return;
  const layers = arcLayers.get(editingArc.id);
  if (!layers) return;
  layers.poly.setLatLngs(
    computeArcPoints(editingArc.lat, editingArc.lon, Number(arcEditRadius.value) || 1, Number(arcEditRotation.value) || 0, editingArcDir)
  );
  layers.poly.setStyle({ color: editingArcColor });
  layers.handle.setIcon(
    L.divIcon({
      className: 'arc-handle',
      html: `<div style="width:12px;height:12px;border-radius:50%;background:${editingArcColor};border:2px solid #fff;"></div>`,
      iconSize: [12, 12],
      iconAnchor: [6, 6],
    })
  );
}

arcDirChoices.forEach((el) => {
  el.addEventListener('click', () => {
    editingArcDir = el.dataset.dir;
    arcDirChoices.forEach((c) => c.classList.toggle('selected', c === el));
    liveUpdateArcPreview();
  });
});
arcColourChoices.forEach((el) => {
  el.addEventListener('click', () => {
    editingArcColor = el.dataset.colour;
    arcColourChoices.forEach((c) => c.classList.toggle('selected', c === el));
    liveUpdateArcPreview();
  });
});
arcEditRadius.addEventListener('input', liveUpdateArcPreview);
arcEditRotation.addEventListener('input', liveUpdateArcPreview);

arcEditSave.addEventListener('click', () => {
  if (!editingArc) return;
  editingArc.radiusM = Math.max(1, Number(arcEditRadius.value) || editingArc.radiusM);
  editingArc.rotationDeg = ((Number(arcEditRotation.value) || 0) % 360 + 360) % 360;
  editingArc.dir = editingArcDir;
  editingArc.color = editingArcColor;
  saveMarkings();
  closeArcEditor();
});

arcEditDelete.addEventListener('click', () => {
  if (!editingArc) return;
  removeArc(editingArc.id);
  closeArcEditor();
});

arcEditCancel.addEventListener('click', () => {
  // Revert any live preview changes made while the modal was open.
  if (editingArc) {
    const layers = arcLayers.get(editingArc.id);
    if (layers) {
      layers.poly.setLatLngs(computeArcPoints(editingArc.lat, editingArc.lon, editingArc.radiusM, editingArc.rotationDeg, editingArc.dir));
      layers.poly.setStyle({ color: editingArc.color || '#ffdd00' });
    }
  }
  closeArcEditor();
});
arcEditBackdrop.addEventListener('click', (e) => {
  if (e.target === arcEditBackdrop) arcEditCancel.click();
});

// --- Taxi Route: turn an ATC clearance into a drawn green route --------
// Parsed server-side (LLM via Ollama, with a scripted phonetic-alphabet
// fallback), scoped to whichever airport's labels are near the plane.
const taxiInstructionText = document.getElementById('taxiInstructionText');
const taxiDrawBtn = document.getElementById('taxiDrawBtn');
const taxiStatus = document.getElementById('taxiStatus');

taxiDrawBtn.addEventListener('click', async () => {
  const text = taxiInstructionText.value.trim();
  if (!text) return;
  if (!lastKnownPosition) {
    taxiStatus.textContent = 'No position from FlightGear yet — can\'t tell which airport you mean.';
    taxiStatus.className = 'error';
    return;
  }

  taxiStatus.textContent = 'Parsing…';
  taxiStatus.className = '';
  taxiDrawBtn.disabled = true;
  try {
    const res = await fetch('/api/taxi-route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, lat: lastKnownPosition.lat, lon: lastKnownPosition.lon }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    if (data.points.length < 2) {
      taxiStatus.textContent =
        `Couldn't match enough identifiers near your position (found: ${data.sequence.join(', ') || 'none'}). ` +
        `Try naming taxiways/holding points that are already labelled on the map.`;
      taxiStatus.className = 'error';
      return;
    }

    const line = {
      id: Date.now() + '-' + Math.random(),
      points: data.points,
      text: data.sequence.join(' → '),
      color: '#33cc33',
      taxiRoute: true,
    };
    markings.lines.push(line);
    strokeStack.push({ type: 'line', id: line.id });
    saveMarkings();
    renderLine(line);

    taxiStatus.textContent = `Drawn via ${data.usedLLM ? 'AI' : 'scripted'} parsing: ${data.sequence.join(' → ')}`;
    taxiStatus.className = 'ok';
  } catch (err) {
    taxiStatus.textContent = `Failed: ${err.message}`;
    taxiStatus.className = 'error';
  } finally {
    taxiDrawBtn.disabled = false;
  }
});

// --- Route Import: paste a SimBrief-style OFP navlog, draw the route ---
// Parsed server-side by a deterministic regex extractor (not the LLM —
// this is exact coordinate data, and a model re-typing digits risks
// silently transposing a number). Each import replaces the previous one
// (shared 'navlog-' id prefix), so pasting a new route cleans up the old.
const navlogText = document.getElementById('navlogText');
const navlogCallsign = document.getElementById('navlogCallsign');
const navlogDrawBtn = document.getElementById('navlogDrawBtn');
const navlogClearBtn = document.getElementById('navlogClearBtn');
const navlogStatus = document.getElementById('navlogStatus');

const COMPASS_16 = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function bearingToCompass(deg) {
  return COMPASS_16[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
}

// Real radio calls use the airport's common name ("Stansted"), not its
// ICAO code or full official name ("London Stansted Airport"). Strip the
// "Airport" suffix and a leading "London " prefix (several UK airports
// are named "London X Airport" in the data but nobody calls them that).
function airportTrafficName(airport) {
  if (!airport) return null;
  let name = airport.name || airport.icao || airport.ident;
  name = name.replace(/\s*(International\s+)?Airport\s*$/i, '').replace(/^London\s+/i, '').trim();
  return name || airport.icao || airport.ident;
}

async function lookupAirportNear(lat, lon) {
  try {
    const res = await fetch(`/api/nearest-airport-frequencies?lat=${lat}&lon=${lon}`);
    const data = await res.json();
    return data.airport || null;
  } catch {
    return null;
  }
}

async function buildUnicomCallLabels(waypoints, callsign) {
  const labels = [];
  const first = waypoints[0];
  const last = waypoints[waypoints.length - 1];

  // --- Departure calls ---
  const depAirport = await lookupAirportNear(first.lat, first.lon);
  const depName = airportTrafficName(depAirport) || first.id;
  let depTurnDir = 'ahead';
  if (waypoints.length > 1) {
    depTurnDir = bearingToCompass(initialBearingDeg({ lat: first.lat, lng: first.lon }, { lat: waypoints[1].lat, lng: waypoints[1].lon }));
  }
  labels.push({ id: 'navlog-call-holdshort', lat: first.lat, lon: first.lon,
    text: `NOW: "${depName} Traffic, ${callsign}, holding short runway, departing to the ${depTurnDir}, ${depName}"` });
  labels.push({ id: 'navlog-call-lineup', lat: first.lat + 0.0006, lon: first.lon + 0.0006,
    text: `"${depName} Traffic, ${callsign}, lining up runway, ${depName}"` });
  labels.push({ id: 'navlog-call-airborne', lat: first.lat + 0.02, lon: first.lon + 0.02,
    text: `"${depName} Traffic, ${callsign}, airborne runway, turning ${depTurnDir}, climbing, ${depName}"` });

  // --- Arrival calls, placed along the actual final inbound track -------
  const destAirport = await lookupAirportNear(last.lat, last.lon);
  const destName = airportTrafficName(destAirport) || last.id;
  const secondLast = waypoints.length > 1 ? waypoints[waypoints.length - 2] : first;
  const inboundBrg = initialBearingDeg({ lat: secondLast.lat, lng: secondLast.lon }, { lat: last.lat, lng: last.lon });
  const outboundBrg = (inboundBrg + 180) % 360;
  const arrivalDir = bearingToCompass(outboundBrg);

  const p15 = destinationPoint(last.lat, last.lon, outboundBrg, 15);
  const p5 = destinationPoint(last.lat, last.lon, outboundBrg, 5);
  labels.push({ id: 'navlog-call-15nm', lat: p15[0], lon: p15[1],
    text: `"${destName} Traffic, ${callsign}, 15 miles ${arrivalDir}, inbound, request join, ${destName}"` });
  labels.push({ id: 'navlog-call-5nm', lat: p5[0], lon: p5[1],
    text: `"${destName} Traffic, ${callsign}, 5 mile final, runway, ${destName}"` });
  labels.push({ id: 'navlog-call-contact', lat: last.lat, lon: last.lon,
    text: `By here: contact ${destName} Tower / cease blind calls once established with ATC` });

  return labels.map((l) => ({ ...l, color: 'yellow' }));
}

function clearImportedNavlogRoute(save) {
  const removedLabelIds = markings.labels.filter((l) => l.id.startsWith('navlog-')).map((l) => l.id);
  for (const id of removedLabelIds) {
    const marker = labelMarkers.get(id);
    if (marker) map.removeLayer(marker);
    labelMarkers.delete(id);
  }
  markings.labels = markings.labels.filter((l) => !l.id.startsWith('navlog-'));

  const removedLineIds = markings.lines.filter((l) => l.id.startsWith('navlog-')).map((l) => l.id);
  for (const id of removedLineIds) {
    const layer = lineLayers.get(id);
    if (layer) map.removeLayer(layer);
    lineLayers.delete(id);
  }
  markings.lines = markings.lines.filter((l) => !l.id.startsWith('navlog-'));

  if (save && (removedLabelIds.length || removedLineIds.length)) saveMarkings();
  return removedLabelIds.length + removedLineIds.length;
}

navlogDrawBtn.addEventListener('click', async () => {
  const text = navlogText.value;
  if (!text.trim()) return;

  navlogStatus.textContent = 'Parsing…';
  navlogStatus.className = '';
  navlogDrawBtn.disabled = true;
  try {
    const res = await fetch('/api/parse-navlog', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    if (data.waypoints.length < 2) {
      navlogStatus.textContent = `Only found ${data.waypoints.length} waypoint(s) — doesn't look like a full navlog. Paste the whole flight log section.`;
      navlogStatus.className = 'error';
      return;
    }

    clearImportedNavlogRoute(false); // replaced below in the same save

    for (const wp of data.waypoints) {
      const label = { id: `navlog-${wp.id}`, lat: wp.lat, lon: wp.lon, text: wp.id, color: 'blue' };
      markings.labels.push(label);
      renderLabel(label);
    }
    const line = {
      id: 'navlog-route',
      points: data.waypoints.map((w) => [w.lat, w.lon]),
      text: data.waypoints.map((w) => w.id).join(' . '),
      color: '#00ccff',
    };
    markings.lines.push(line);
    renderLine(line);

    navlogStatus.textContent = 'Looking up departure/destination airports for UNICOM calls…';
    let callsign = navlogCallsign.value.trim();
    if (!callsign) {
      try {
        const posRes = await fetch('/api/position');
        const pos = await posRes.json();
        callsign = pos.callsign || 'CALLSIGN';
      } catch {
        callsign = 'CALLSIGN';
      }
    }
    const callLabels = await buildUnicomCallLabels(data.waypoints, callsign);
    for (const label of callLabels) {
      markings.labels.push(label);
      renderLabel(label);
    }

    saveMarkings();

    navlogStatus.textContent =
      `Drawn: ${data.waypoints.length} waypoints (${data.waypoints[0].id} → ${data.waypoints[data.waypoints.length - 1].id}) ` +
      `+ ${callLabels.length} UNICOM calls (${callsign})`;
    navlogStatus.className = 'ok';
  } catch (err) {
    navlogStatus.textContent = `Failed: ${err.message}`;
    navlogStatus.className = 'error';
  } finally {
    navlogDrawBtn.disabled = false;
  }
});

navlogClearBtn.addEventListener('click', () => {
  const n = clearImportedNavlogRoute(true);
  navlogStatus.textContent = n ? `Cleared ${n} imported marking(s).` : 'Nothing imported to clear.';
  navlogStatus.className = 'ok';
});

// --- Ruler tool: double-click sets an origin, mouse movement shows live
// heading + distance from it, double-click again clears it.
const measureTooltip = document.getElementById('measureTooltip');
let measureOrigin = null;
let measureLine = null;

function toRad(deg) { return (deg * Math.PI) / 180; }
function toDeg(rad) { return (rad * 180) / Math.PI; }

function greatCircleDistanceNm(a, b) {
  const R = 3440.065; // nm
  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lng - a.lng);
  const s =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

function initialBearingDeg(a, b) {
  const y = Math.sin(toRad(b.lng - a.lng)) * Math.cos(toRad(b.lat));
  const x =
    Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) -
    Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(toRad(b.lng - a.lng));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function toggleMeasure(latlng) {
  if (measureOrigin) {
    clearMeasure();
    return;
  }
  measureOrigin = latlng;
  measureLine = L.polyline([latlng, latlng], { color: '#00ccff', weight: 2, dashArray: '4 4' }).addTo(map);
  measureTooltip.style.display = 'block';
}

function clearMeasure() {
  measureOrigin = null;
  if (measureLine) {
    map.removeLayer(measureLine);
    measureLine = null;
  }
  measureTooltip.style.display = 'none';
}

map.on('mousemove', (e) => {
  if (!measureOrigin) return;
  const dist = greatCircleDistanceNm(measureOrigin, e.latlng);
  const brg = initialBearingDeg(measureOrigin, e.latlng);
  measureLine.setLatLngs([measureOrigin, e.latlng]);

  const point = map.latLngToContainerPoint(e.latlng);
  const mapRect = map.getContainer().getBoundingClientRect();
  measureTooltip.style.left = `${mapRect.left + point.x}px`;
  measureTooltip.style.top = `${mapRect.top + point.y}px`;
  measureTooltip.textContent = `${Math.round(brg).toString().padStart(3, '0')}°  ·  ${dist.toFixed(2)} NM`;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && measureOrigin) clearMeasure();
});

// --- Nav waypoint fixes (from FlightGear's own Navaids/fix.dat) --------
// These are enroute/terminal fixes spread across ~80nm — meaningful at
// regional zoom, but pure clutter once you're zoomed into street level,
// so the layer auto-hides past WAYPOINT_MAX_ZOOM regardless of the toggle.
const waypointsBtn = document.getElementById('waypointsBtn');
const WAYPOINT_MAX_ZOOM = 12;
let waypointsOn = false;
let waypointsLayer = null;
let waypointsLoaded = false;

async function ensureWaypointsLoaded() {
  if (waypointsLoaded) return;
  waypointsLoaded = true;
  const res = await fetch('/api/waypoints');
  const fixes = await res.json();
  waypointsLayer = L.layerGroup(
    fixes.map((fx) =>
      L.circleMarker([fx.lat, fx.lon], {
        radius: 4,
        color: '#0d1b2a',
        fillColor: '#8ecbff',
        fillOpacity: 1,
        weight: 1.5,
      }).bindTooltip(fx.name, { permanent: true, direction: 'top', className: 'waypoint-label', offset: [0, -6] })
    )
  );
}

function updateWaypointsVisibility() {
  if (!waypointsLayer) return;
  const shouldShow = waypointsOn && map.getZoom() <= WAYPOINT_MAX_ZOOM;
  const isShown = map.hasLayer(waypointsLayer);
  if (shouldShow && !isShown) waypointsLayer.addTo(map);
  else if (!shouldShow && isShown) map.removeLayer(waypointsLayer);
}

waypointsBtn.addEventListener('click', async () => {
  waypointsOn = !waypointsOn;
  waypointsBtn.classList.toggle('toggle-on', waypointsOn);
  if (waypointsOn) await ensureWaypointsLoaded();
  updateWaypointsVisibility();
});

map.on('zoomend', updateWaypointsVisibility);

loadMarkings().then(async () => {
  // One-time migration: pull in anything saved under the old
  // localStorage-only version of this tool, then hand it to the server.
  if (markings.labels.length === 0 && markings.lines.length === 0) {
    let oldLabels = [];
    let oldLines = [];
    try {
      oldLabels = JSON.parse(localStorage.getItem('fgTrackerLabels')) || [];
      oldLines = JSON.parse(localStorage.getItem('fgTrackerLines')) || [];
    } catch {}
    if (oldLabels.length || oldLines.length) {
      markings.labels = oldLabels;
      markings.lines = oldLines;
      await saveMarkings();
      localStorage.removeItem('fgTrackerLabels');
      localStorage.removeItem('fgTrackerLines');
      console.log(`Migrated ${oldLabels.length} label(s) and ${oldLines.length} line(s) from localStorage to server.`);
    }
  }
  markings.labels.forEach(renderLabel);
  markings.lines.forEach(renderLine);
  markings.arcs.forEach(renderArc);
});

// --- Circuit leg headings table -----------------------------------------
const circuitRwyHeading = document.getElementById('circuitRwyHeading');
const circuitUseCurrentBtn = document.getElementById('circuitUseCurrentBtn');
const circuitDirChoices = [...document.querySelectorAll('.circuit-dir-choice')];
const circuitTableBody = document.querySelector('#circuitTable tbody');
let circuitDir = 'right';

function updateCircuitTable() {
  const rwy = ((Number(circuitRwyHeading.value) || 0) % 360 + 360) % 360;
  const step = circuitDir === 'right' ? 90 : -90;
  const legs = ['Upwind', 'Crosswind', 'Downwind', 'Base', 'Final'];
  circuitTableBody.innerHTML = legs
    .map((leg, i) => {
      const hdg = ((rwy + step * i) % 360 + 360) % 360;
      return `<tr><td>${leg}</td><td>${hdg.toString().padStart(3, '0')}&deg;</td></tr>`;
    })
    .join('');
}

circuitRwyHeading.addEventListener('input', updateCircuitTable);
circuitUseCurrentBtn.addEventListener('click', () => {
  if (!lastKnownPosition || lastKnownPosition.heading === undefined) return;
  circuitRwyHeading.value = Math.round(lastKnownPosition.heading);
  updateCircuitTable();
});
circuitDirChoices.forEach((el) => {
  el.addEventListener('click', () => {
    circuitDir = el.dataset.circuitdir;
    circuitDirChoices.forEach((c) => c.classList.toggle('selected', c === el));
    updateCircuitTable();
  });
});
updateCircuitTable();
</script>
